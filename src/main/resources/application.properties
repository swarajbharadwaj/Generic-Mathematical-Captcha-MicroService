spring.application.name=captcha-service
# Server Port
server.port=5000

# CAPTCHA general settings
captcha.difficulty.default=L1

# --- JWT Configuration for Stateless CAPTCHA ---
# IMPORTANT: Use a long, random, Base64-encoded secret in production.
# Generate one using: openssl rand -base64 32
captcha.jwt.secret=f1794fef7cad4054b95c3cc0d9051e71
captcha.jwt.ttl-seconds=180

# --- Resilience4j Rate Limiter Configuration ---
# This configures a rate limiter named 'captchaGenerate'
resilience4j.ratelimiter:
  instances:
    captchaGenerate:
      limitForPeriod: 10              # Allow 10 requests...
      limitRefreshPeriod: 1m          # ...per minute.
      timeoutDuration: 0              # Don't wait, fail immediately if limit is exceeded.
      registerHealthIndicator: true

